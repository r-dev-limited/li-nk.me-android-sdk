# LinkMe example base URL for SDK calls.
# You can override this per-user in ~/.gradle/gradle.properties
# or set an env var LINKME_BASE_URL when building/running.

# Set LINKME_BASE_URL in ~/.gradle/gradle.properties or the environment for
# local tunnel testing. The example app otherwise uses its production default.

# Use AndroidX (required by Compose and many Google libs)
android.useAndroidX=true
# Jetifier helps if any old support library deps sneak in via transitive dependencies
android.enableJetifier=true

# Compose/Kotlin compilation needs enough heap for current Android tooling.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Set LINKME_APP_LINKS_HOST in ~/.gradle/gradle.properties or the environment
# when testing App Links against a custom domain.
